x-mcp:
  name: git
  description: "Local git operations on repos under the shared workspace (/data)"
  transport: streamable-http
  port: 3002
  path: /mcp

services:
  mcp-git:
    build: ./mcp/images/git
    image: ic-mcp-git
    networks:
      - internal
    volumes:
      - workspace:/data
    expose:
      - "3002"
    healthcheck:
      # TCP connect to the bridge port (images have node but no curl)
      test: ["CMD", "node", "-e", "require('net').connect(3002,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256

networks:
  internal:
    name: ic-internal
    external: true

volumes:
  workspace:
    name: ic-workspace
    external: true
