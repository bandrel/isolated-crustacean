x-mcp:
  name: fetch
  description: "HTTP fetch of allowlisted HTTPS sites - requests route through tinyproxy"
  transport: streamable-http
  port: 3003
  path: /mcp

services:
  mcp-fetch:
    build: ./mcp/images/fetch
    image: ic-mcp-fetch
    networks:
      - internal
    environment:
      HTTP_PROXY: http://tinyproxy:8888
      HTTPS_PROXY: http://tinyproxy:8888
      http_proxy: http://tinyproxy:8888
      https_proxy: http://tinyproxy:8888
    expose:
      - "3003"
    healthcheck:
      # TCP connect to the bridge port (images have node but no curl)
      test: ["CMD", "node", "-e", "require('net').connect(3003,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256

networks:
  internal:
    name: ic-internal
    external: true
