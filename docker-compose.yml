services:
  claude-code:
    build:
      context: ./claude-code
      args:
        USERNAME: ${HOST_USER:-node}
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    stdin_open: true
    tty: true
    environment:
      - HTTP_PROXY=http://tinyproxy:8888
      - HTTPS_PROXY=http://tinyproxy:8888
      - http_proxy=http://tinyproxy:8888
      - https_proxy=http://tinyproxy:8888
    networks:
      - internal
    volumes:
      - workspace:/home/${HOST_USER:-node}/workspace
      - ${HOST_HOME:-.}/.claude:/home/${HOST_USER:-node}/.claude
      - ${HOST_HOME:-.}/.claude.json:/home/${HOST_USER:-node}/.claude.json
    depends_on:
      - tinyproxy

  tinyproxy:
    build: ./tinyproxy
    networks:
      - internal
      - external

networks:
  internal:
    internal: true
  external:
    driver: bridge

volumes:
  workspace: