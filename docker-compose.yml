services:
  claude-code:
    build: ./claude-code
    stdin_open: true
    tty: true
    environment:
      - HTTP_PROXY=http://tinyproxy:8888
      - HTTPS_PROXY=http://tinyproxy:8888
      - http_proxy=http://tinyproxy:8888
      - https_proxy=http://tinyproxy:8888
    networks:
      - internal
    volumes:
      - workspace:/home/node/workspace
      - ${HOST_HOME:-.}/.claude:/home/node/.claude
      - ${HOST_HOME:-.}/.claude.json:/home/node/.claude.json
    depends_on:
      - tinyproxy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache
      - /home/node/.npm
    pids_limit: 512

  tinyproxy:
    build: ./tinyproxy
    networks:
      - internal
      - external
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/tinyproxy
      - /var/run/tinyproxy
    pids_limit: 100

networks:
  internal:
    name: ic-internal
    internal: true
  external:
    name: ic-external
    driver: bridge

volumes:
  workspace:
    name: ic-workspace