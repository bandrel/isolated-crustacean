services:
  claude-code:
    build: ./claude-code
    stdin_open: true
    tty: true
    environment:
      - HTTP_PROXY=http://tinyproxy:8888
      - HTTPS_PROXY=http://tinyproxy:8888
      - http_proxy=http://tinyproxy:8888
      - https_proxy=http://tinyproxy:8888
    networks:
      - internal
    volumes:
      - workspace:/home/node/workspace
      - ${HOST_HOME:-.}/.claude:/home/node/.claude
      - ${HOST_HOME:-.}/.claude.json:/home/node/.claude.json
    depends_on:
      - tinyproxy

  tinyproxy:
    build: ./tinyproxy
    networks:
      - internal
      - external

networks:
  internal:
    name: ic-internal
    internal: true
  external:
    name: ic-external
    driver: bridge

volumes:
  workspace:
    name: ic-workspace