User nobody
Group nogroup

Port 8888
Timeout 120

LogLevel Info
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/var/run/tinyproxy/tinyproxy.pid"
MaxClients 50

# Docker's internal networks use the 172.16-31.x.x range. Restricting to this
# subnet prevents the proxy from being an open relay. Never add a ports: mapping
# to this service or it becomes accessible from outside Docker.
Allow 172.16.0.0/12
DisableViaHeader Yes

Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterDefaultDeny Yes

ConnectPort 443
