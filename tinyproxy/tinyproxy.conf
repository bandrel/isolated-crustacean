User nobody
Group nogroup

Port 8888
Timeout 120

LogLevel Info
MaxClients 50

# Only accept clients from private (RFC1918) address space so the proxy can
# never act as an open relay. Docker's default address pools hand out
# 172.16.0.0/12 first and spill into 192.168.0.0/16; custom pools commonly use
# 10.0.0.0/8, so all three ranges are needed for ic-internal to be accepted.
# Never add a ports: mapping to this service or it becomes accessible from
# outside Docker.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
DisableViaHeader Yes

Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterDefaultDeny Yes

ConnectPort 443
